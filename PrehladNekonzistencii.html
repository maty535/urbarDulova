            let currentAreaMode = 'all';
            let selectedBubble = null;

            function getFilteredData() {
                return rawData.filter(item => {
                    const vymera = Number(item['Celková výmera (m²)'] || 0);
                    if (currentAreaMode === 'under') return vymera < 2000;
                    if (currentAreaMode === 'over') return vymera >= 2000;
                    return true;
                });
            }

            function updateChart() {
                const dataToDisplay = getFilteredData();
                
                const groups = {};
                dataToDisplay.forEach(item => {
                    const x = item['Chýbajúce LV (počet)'];
                    const y = item['Odchýlky v zlomkoch'];
                    const key = x + '_' + y;
                    
                    if (!groups[key]) {
                        groups[key] = { x: x, y: y, count: 0 };
                    }
                    groups[key].count++;
                });

                const groupedArray = Object.values(groups);

                const xVals = groupedArray.map(g => g.x);
                const yVals = groupedArray.map(g => g.y + 1);
                const counts = groupedArray.map(g => g.count);
                const customData = groupedArray.map(g => [g.x, g.y]);

                const colors = groupedArray.map(g => {
                    const xi = g.x;
                    const yi = g.y;
                    if (xi === 0) {
                        if (yi === 0) return '#28a745';
                        if (yi === 1) return '#1e7e34';
                        if (yi === 2) return '#155724';
                        return '#0b2e13';
                    } else {
                        const err = xi + yi;
                        if (err <= 2) return '#ffc107';
                        if (err <= 4) return '#fd7e14';
                        if (err <= 6) return '#dc3545';
                        return '#84101c';
                    }
                });

                const sizes = counts.map(c => Math.sqrt(c) * 25 + 15);

                const trace = {
                    x: xVals,
                    y: yVals,
                    mode: 'markers+text',
                    text: counts.map(String),
                    textposition: 'middle center',
                    textfont: { size: 14, color: 'white', family: 'Arial Black' },
                    marker: {
                        size: sizes,
                        color: colors,
                        line: { width: 1.5, color: 'black' }
                    },
                    hovertemplate: '<b>Chýbajúce LV:</b> %{x}<br><b>Počet podielov:</b> %{y}<br><b>Počet vlastníkov:</b> %{text}<extra></extra>',
                    customdata: customData
                };

                const layout = {
                    title: '<b>Počet nekonzistentných subjektov</b>',
                    xaxis: { title: '<b>Chýbajúce LV (počet s 0/1)</b>' },
                    yaxis: { title: '<b>Počet rôznych zlomkov / podielov</b>' },
                    hovermode: 'closest',                    
                    template: 'plotly_white',
                    autosize: true,
                    margin: { t: 40, b: 40, l: 40, r: 20 }
                };
                
                const config = {
                    // Odstráni tlačidlo "Compare data on hover" z hornej lišty grafu
                    modeBarButtonsToRemove: ['hoverCompareCartesian'], 
                    responsive: true
                };

                Plotly.react('plotly-chart', [trace], layout, config).then(() => {
                    const plotlyDiv = document.getElementById('plotly-chart');
                    plotlyDiv.removeAllListeners('plotly_click');
                    plotlyDiv.on('plotly_click', function(data){
                        if(data.points.length > 0) {
                            const point = data.points[0];
                            selectedBubble = {
                                chybajuceLV: point.customdata[0],
                                odchylkaZlomkov: point.customdata[1]
                            };
                            renderTable();
                        }
                    });
                });

                renderTable();
            }

            function renderTable() {
                let data = getFilteredData();

                if (selectedBubble) {
                    data = data.filter(item => 
                        item['Chýbajúce LV (počet)'] === selectedBubble.chybajuceLV && 
                        item['Odchýlky v zlomkoch'] === selectedBubble.odchylkaZlomkov
                    );
                }

                const tbody = document.getElementById('table-body');
                tbody.innerHTML = '';
                
                data.forEach(row => {
                    const tr = document.createElement('tr');
                    const missingText = row['Chýbajúce LV zoznam'] || 'OK (Úplný)';
                    const missingStyle = (missingText === 'OK (Úplný)') ? 'ok-lv' : 'missing-lv';

                    const vymera = Number(row['Celková výmera (m²)'] || 0);
                    const vymeraHtml = (vymera < 2000) 
                        ? `<span class="small-area">${vymera.toLocaleString('sk-SK')} m²</span>`
                        : `${vymera.toLocaleString('sk-SK')} m²`;

                    tr.innerHTML = `
                        <td><b>${row['Meno']}</b></td>
                        <td>${vymeraHtml}</td>
                        <td>${row['Skóre nesúladu']}</td>
                        <td>${row['Zlomky podielov']}</td>
                        <td class="${missingStyle}">${missingText}</td>
                    `;
                    tbody.appendChild(tr);
                });

                let label = `Zobrazení: ${data.length} vlastník(ov)`;
                if (selectedBubble) {
                    label = `Skupina [LV: ${selectedBubble.chybajuceLV}, Podiely: ${selectedBubble.odchylkaZlomkov + 1}] (${data.length})`;
                }
                document.getElementById('filter-label').innerText = label;
            }

            function setAreaFilter(mode) {
                currentAreaMode = mode;
                document.querySelectorAll('.btn-toggle button').forEach(b => b.classList.remove('active'));
                if (mode === 'all') document.getElementById('btn-all').classList.add('active');
                if (mode === 'under') document.getElementById('btn-under').classList.add('active');
                if (mode === 'over') document.getElementById('btn-over').classList.add('active');
                
                updateChart();
            }

            function resetTableSelection() {
                selectedBubble = null;
                renderTable();
            }

            document.addEventListener('DOMContentLoaded', () => {
                updateChart();
            });
        </script>
