                background: #ced4da;
                padding: 3px;
                border-radius: 5px;
            }
            
            .btn-toggle button {
                padding: 6px 12px;
                background: transparent;
                color: #495057;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-weight: bold;
                font-size: 12px;
                transition: all 0.2s ease;

            .btn-toggle button.active {
                background: #0056b3;
                color: white;

                font-weight: bold; 
                padding: 2px 6px; 
                border-radius: 4px; 
                display: inline-block;

            .owner-name {

                color: #0056b3;
                text-decoration: underline dotted #0056b3;

            .owner-name:hover {
                color: #003d80;
            }

                background-color: #ffffff;
                border: 1px solid #ced4da;

                z-index: 9999;
                font-size: 12px;
                color: #212529;
                max-width: 460px;
                pointer-events: none;
            }

            }

            let currentAreaMode = 'all';
            let selectedBubble = null;

            function getFilteredData() {
                return rawData.filter(item => {
                    const vymera = Number(item['Celková výmera (m²)'] || 0);
                    if (currentAreaMode === 'under') return vymera < 2000;
                    if (currentAreaMode === 'over') return vymera >= 2000;
                    return true;
                });
            }

            function updateChart() {
                const dataToDisplay = getFilteredData();
                
                const groups = {};
                dataToDisplay.forEach(item => {
                    const x = item['Chýbajúce LV (počet)'];
                    const y = item['Odchýlky v zlomkoch'];
                    const key = x + '_' + y;
                    
                    if (!groups[key]) {
                        groups[key] = { x: x, y: y, count: 0 };
                    }
                    groups[key].count++;
                });

                const groupedArray = Object.values(groups);

                const xVals = groupedArray.map(g => g.x);
                const yVals = groupedArray.map(g => g.y + 1);
                const counts = groupedArray.map(g => g.count);
                const customData = groupedArray.map(g => [g.x, g.y]);

                const colors = groupedArray.map(g => {
                    const xi = g.x;
                    const yi = g.y;
                    if (xi === 0) {
                        if (yi === 0) return '#28a745';
                        if (yi === 1) return '#1e7e34';
                        if (yi === 2) return '#155724';
                        return '#0b2e13';
                    } else {
                        const err = xi + yi;
                        if (err <= 2) return '#ffc107';
                        if (err <= 4) return '#fd7e14';
                        if (err <= 6) return '#dc3545';
                        return '#84101c';
                    }
                });

                const sizes = counts.map(c => Math.sqrt(c) * 25 + 15);

                const trace = {
                    x: xVals,
                    y: yVals,
                    mode: 'markers+text',
                    text: counts.map(String),
                    textposition: 'middle center',
                    textfont: { size: 14, color: 'white', family: 'Arial Black' },
                    marker: {
                        size: sizes,
                        color: colors,
                        line: { width: 1.5, color: 'black' }
                    },
                    hovertemplate: '<b>Chýbajúce LV:</b> %{x}<br><b>Počet podielov:</b> %{y}<br><b>Počet vlastníkov:</b> %{text}<extra></extra>',
                    customdata: customData
                };

                const layout = {
                    title: '<b>Subjekty podľa stavu ich podielov zapísanycých v KN</b>',
                    xaxis: { title: '<b>Chýbajúce LV (počet s 0/1)</b>' },
                    yaxis: { title: '<b>Počet rôznych zlomkov / podielov</b>' },
                    template: 'plotly_white',
                    autosize: true,
                    hovermode: 'closest',
                    margin: { t: 40, b: 40, l: 40, r: 20 }
                };
                const config = {
                    modeBarButtonsToRemove: ['hoverCompareCartesian'], 
                    responsive: true
                };

                Plotly.react('plotly-chart', [trace], layout, config).then(() => {
                    const plotlyDiv = document.getElementById('plotly-chart');
                    plotlyDiv.removeAllListeners('plotly_click');
                    plotlyDiv.on('plotly_click', function(data){
                        if(data.points.length > 0) {
                            const point = data.points[0];
                            selectedBubble = {
                                chybajuceLV: point.customdata[0],
                                odchylkaZlomkov: point.customdata[1]
                            };
                            renderTable();
                        }
                    });
                });

                renderTable();
            }

            /* Logika vlastného tooltipu */
            function buildTooltipHTML(row) {
                const adresaText = row['Adresa'] ? row['Adresa'] : 'neuvedená';
                const dobText = row['DOB'] ? row['DOB'] : 'neuvedený';
                
                let lvTableHtml = '';
                if (row['DetailyLV'] && row['DetailyLV'].length > 0) {
                    let rowsHtml = '';
                    row['DetailyLV'].forEach(item => {
                        rowsHtml += `
                            <tr>
                                <td><b>LV ${item.lv}</b></td>
                                <td style="text-align: center;">${item.podiel}</td>
                                <td>${item.titul || 'Bez titulu'}</td>
                            </tr>
                        `;
                    });

                    lvTableHtml = `
                        <div style="margin-top: 8px; font-weight: bold; color: #343a40;">Vlastnícke listy a tituly nadobudnutia:</div>
                        <table class="tooltip-table">
                            <thead>
                                <tr>
                                    <th style="width: 65px;">LV</th>
                                    <th style="width: 65px; text-align: center;">Podiel</th>
                                    <th>Titul nadobudnutia</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rowsHtml}
                            </tbody>
                        </table>
                    `;
                } else {
                    lvTableHtml = `<div style="margin-top: 8px; color: #6c757d; font-style: italic;">Žiadne aktívne LV s reálnym podielom (> 0)</div>`;
                }

                return `
                    <h4>${row['Meno']}</h4>
                    <div class="info-line"><b>Adresa:</b> ${adresaText}</div>
                    <div class="info-line"><b>Dátum nar.:</b> ${dobText}</div>
                    ${lvTableHtml}
                `;
            }

            let isPinned = false;
            let pinnedOwner = null;

            function showTooltip(e, row, forcePin = false) {
                if (isPinned && !forcePin) return;
                
                const tooltip = document.getElementById('custom-tooltip');
                tooltip.innerHTML = buildTooltipHTML(row);
                tooltip.style.display = 'block';
                
                if (forcePin) {
                    isPinned = true;
                    pinnedOwner = row['Meno'];
                    tooltip.classList.add('pinned');
                } else {
                    tooltip.classList.remove('pinned');
                }

                positionTooltip(e);
            }

            function moveTooltip(e) {
                if (isPinned) return;
                positionTooltip(e);
            }

            function positionTooltip(e) {
                const tooltip = document.getElementById('custom-tooltip');
                if (tooltip.style.display !== 'block') return;

                const pad = 15;
                let x = e.clientX + pad;
                let y = e.clientY + pad;

                const tooltipWidth = tooltip.offsetWidth;
                const tooltipHeight = tooltip.offsetHeight;
                
                if (x + tooltipWidth > window.innerWidth - 10) {
                    x = e.clientX - tooltipWidth - pad;
                }
                if (y + tooltipHeight > window.innerHeight - 10) {
                    y = e.clientY - tooltipHeight - pad;
                }

                tooltip.style.left = Math.max(10, x) + 'px';
                tooltip.style.top = Math.max(10, y) + 'px';
            }

            function hideTooltip(force = false) {
                if (isPinned && !force) return;
                const tooltip = document.getElementById('custom-tooltip');
                tooltip.style.display = 'none';
                tooltip.classList.remove('pinned');
                isPinned = false;
                pinnedOwner = null;
            }

            function togglePinTooltip(e, row) {
                e.stopPropagation();
                if (isPinned && pinnedOwner === row['Meno']) {
                    hideTooltip(true);
                } else {
                    isPinned = false;
                    showTooltip(e, row, true);
                }
            }

            function renderTable() {
                let data = getFilteredData();

                if (selectedBubble) {
                    data = data.filter(item => 
                        item['Chýbajúce LV (počet)'] === selectedBubble.chybajuceLV && 
                        item['Odchýlky v zlomkoch'] === selectedBubble.odchylkaZlomkov
                    );
                }

                const tbody = document.getElementById('table-body');
                tbody.innerHTML = '';
                
                data.forEach(row => {
                    const tr = document.createElement('tr');
                    const missingText = row['Chýbajúce LV zoznam'] || 'OK (Úplný)';
                    const missingStyle = (missingText === 'OK (Úplný)') ? 'ok-lv' : 'missing-lv';

                    const vymera = Number(row['Celková výmera (m²)'] || 0);
                    const vymeraHtml = (vymera < 2000) 
                        ? `<span class="small-area">${vymera.toLocaleString('sk-SK')} m²</span>`
                        : `${vymera.toLocaleString('sk-SK')} m²`;

                    // Vytvorenie elementu pre meno s event listenerom na hover a klik
                    const tdMeno = document.createElement('td');
                    const bMeno = document.createElement('b');
                    bMeno.className = 'owner-name';
                    bMeno.innerText = row['Meno'];

                    bMeno.addEventListener('mouseenter', (e) => showTooltip(e, row, false));
                    bMeno.addEventListener('mousemove', (e) => moveTooltip(e));
                    bMeno.addEventListener('mouseleave', () => hideTooltip(false));
                    bMeno.addEventListener('click', (e) => togglePinTooltip(e, row));

                    tdMeno.appendChild(bMeno);
                    tr.appendChild(tdMeno);

                    const tdVymera = document.createElement('td');
                    tdVymera.innerHTML = vymeraHtml;
                    tr.appendChild(tdVymera);

                    const tdSkore = document.createElement('td');
                    tdSkore.innerText = row['Skóre nesúladu'];
                    tr.appendChild(tdSkore);

                    const tdZlomky = document.createElement('td');
                    tdZlomky.innerText = row['Zlomky podielov'];
                    tr.appendChild(tdZlomky);

                    const tdMissing = document.createElement('td');
                    tdMissing.className = missingStyle;
                    tdMissing.innerText = missingText;
                    tr.appendChild(tdMissing);

                    tbody.appendChild(tr);
                });

                let label = `Zobrazení: ${data.length} vlastník(ov)`;
                if (selectedBubble) {
                    label = `Skupina [LV: ${selectedBubble.chybajuceLV}, Podiely: ${selectedBubble.odchylkaZlomkov + 1}] (${data.length})`;
                }
                document.getElementById('filter-label').innerText = label;
            }

            function setAreaFilter(mode) {
                currentAreaMode = mode;
                document.querySelectorAll('.btn-toggle button').forEach(b => b.classList.remove('active'));
                if (mode === 'all') document.getElementById('btn-all').classList.add('active');
                if (mode === 'under') document.getElementById('btn-under').classList.add('active');
                if (mode === 'over') document.getElementById('btn-over').classList.add('active');
                
                updateChart();
            }

            function resetTableSelection() {
                selectedBubble = null;
                renderTable();
            }

            // Zatvorenie zamknutého tooltipu pri kliknutí mimo nemu
            document.addEventListener('click', (e) => {
                const tooltip = document.getElementById('custom-tooltip');
                if (isPinned && !tooltip.contains(e.target) && !e.target.classList.contains('owner-name')) {
                    hideTooltip(true);
                }
            });

            document.addEventListener('DOMContentLoaded', () => {
                updateChart();
            });
        </script>
